y="415" font-size="13" fill="#262626">0.85</text><text x="240" y="444" font-size="11" fill="#666666">Scores run from 0 to 1. The deployment default is 0.40 and 0.85.</text><rect x="240" y="458" width="123" height="26" fill="#262626" stroke="#262626" stroke-width="1" rx="5"/><text x="301.5" y="475.32" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Save thresholds</text><rect x="371" y="458" width="130" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" rx="5"/><text x="436" y="475.32" font-size="12" fill="#262626" font-weight="500" text-anchor="middle">Reset to default</text><text x="240" y="506" font-size="11" fill="#666666">These values apply to mail arriving from now on.</text><text x="240" y="522" font-size="11" fill="#666666">Check again in a label list updates older mail.</text><line x1="240" y1="552" x2="912" y2="552" stroke="#e6e6e6" stroke-width="1"/><text x="240" y="566" font-size="11" fill="#666666" font-weight="700">PER LABEL</text><rect x="240" y="596" width="47" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="9"/><circle cx="249" cy="605" r="3" fill="#666666"/><text x="256" y="609" font-size="11" fill="#262626" font-weight="600">Spam</text><rect x="380" y="590" width="189" height="28" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1" rx="6"/><rect x="382" y="592" width="80" height="24" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" rx="5"/><text x="422" y="608" font-size="12" fill="#262626" font-weight="600" text-anchor="middle">Warn only</text><text x="516.5" y="608" font-size="12" fill="#666666" font-weight="400" text-anchor="middle">Move to Junk</text><rect x="240" y="636" width="71" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="9"/><circle cx="249" cy="645" r="3" fill="#666666"/><text x="256" y="649" font-size="11" fill="#262626" font-weight="600">Phishing</text><rect x="380" y="630" width="189" height="28" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1" rx="6"/><text x="422" y="648" font-size="12" fill="#666666" font-weight="400" text-anchor="middle">Warn only</text><rect x="466" y="632" width="101" height="24" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" rx="5"/><text x="516.5" y="648" font-size="12" fill="#262626" font-weight="600" text-anchor="middle">Move to Junk</text><text x="240" y="684" font-size="11" fill="#666666">Warn only keeps the message where it arrived, under the warning banner.</text><line x1="240" y1="710" x2="912" y2="710" stroke="#e6e6e6" stroke-width="1"/><text x="240" y="724" font-size="11" fill="#666666" font-weight="700">SENDERS</text><rect x="240" y="746" width="672" height="42" fill="none" stroke="#bdbdbd" stroke-width="1" rx="6"/><text x="252" y="764" font-size="13" fill="#262626" font-weight="600">Never in Spam</text><text x="252" y="780" font-size="11" fill="#666666">Their mail skips the spam check.</text><text x="762" y="772" font-size="12" fill="#262626" text-anchor="end">4 senders</text><text x="900" y="772" font-size="12" fill="#262626" font-weight="600" text-anchor="end" text-decoration="underline">Manage</text><rect x="240" y="794" width="672" height="42" fill="none" stroke="#bdbdbd" stroke-width="1" rx="6"/><text x="252" y="812" font-size="13" fill="#262626" font-weight="600">Reported</text><text x="252" y="828" font-size="11" fill="#666666">Their mail goes straight to Junk.</text><text x="762" y="820" font-size="12" fill="#262626" text-anchor="end">12 senders</text><text x="900" y="820" font-size="12" fill="#262626" font-weight="600" text-anchor="end" text-decoration="underline">Manage</text><line x1="240" y1="858" x2="912" y2="858" stroke="#e6e6e6" stroke-width="1"/><circle cx="960" cy="100" r="9" fill="#262626"/><text x="960" y="104" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="974" y="104" font-size="11" fill="#666666" font-style="italic">Non-auth failure. The thresholds still load and</text><text x="974" y="119" font-size="11" fill="#666666" font-style="italic">save.</text>
