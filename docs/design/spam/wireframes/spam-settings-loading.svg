<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1220" viewBox="0 0 1280 1220" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="1220" fill="#ffffff" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1280" height="44" fill="#f2f2f2" stroke="none" stroke-width="1"/><line x1="0" y1="44" x2="1280" y2="44" stroke="#bdbdbd" stroke-width="1"/><text x="16" y="20" font-size="14" fill="#262626" font-weight="700">Spam settings: loading</text><text x="16" y="36" font-size="11" fill="#666666" font-family="monospace">Story: Playground/Proposed/Spam settings Loading</text>
<g transform="translate(0,44)">
<rect x="0" y="0" width="220" height="1176" fill="#f2f2f2" stroke="none" stroke-width="1"/><line x1="220" y1="0" x2="220" y2="1176" stroke="#bdbdbd" stroke-width="1"/><line x1="0" y1="48" x2="220" y2="48" stroke="#bdbdbd" stroke-width="1"/><text x="16" y="30" font-size="13" fill="#262626">&lt; Back to mail</text><text x="16" y="72" font-size="10" fill="#666666" font-weight="700">SETTINGS</text><rect x="18" y="90" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="100" font-size="13" fill="#262626" font-weight="400">Accounts</text><rect x="18" y="120" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="130" font-size="13" fill="#262626" font-weight="400">Senders &amp; Rules</text><rect x="18" y="150" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="160" font-size="13" fill="#262626" font-weight="400">Folder roles</text><rect x="18" y="180" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="190" font-size="13" fill="#262626" font-weight="400">Filters</text><rect x="18" y="210" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="220" font-size="13" fill="#262626" font-weight="400">Labels</text><rect x="18" y="240" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="250" font-size="13" fill="#262626" font-weight="400">Mail classification</text><rect x="8" y="262" width="204" height="28" fill="#cccccc" stroke="none" stroke-width="1" rx="5"/><rect x="18" y="270" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="280" font-size="13" fill="#262626" font-weight="600">Spam &amp; phishing</text><text x="206" y="280" font-size="10" fill="#666666" text-anchor="end" font-style="italic">new</text><rect x="18" y="300" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="310" font-size="13" fill="#262626" font-weight="400">Calendars</text><rect x="18" y="330" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="340" font-size="13" fill="#262626" font-weight="400">Appearance</text><rect x="18" y="360" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="370" font-size="13" fill="#262626" font-weight="400">Warnings</text><rect x="18" y="390" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="400" font-size="13" fill="#262626" font-weight="400">Advanced</text><line x1="220" y1="48" x2="1280" y2="48" stroke="#bdbdbd" stroke-width="1"/><text x="240" y="30" font-size="16" fill="#262626" font-weight="700">Spam &amp; phishing</text><text x="390.4" y="30" font-size="12" fill="#666666">What Remit flagged, and when it acts.</text><text x="240" y="80" font-size="11" fill="#666666" font-weight="700">LAST 30 DAYS</text><rect x="240" y="100" width="300" height="14" fill="#e6e6e6" stroke="none" stroke-width="1" rx="3"/><rect x="240" y="124" width="672" height="300" fill="#f2f2f2" stroke="none" stroke-width="1" rx="6"/><line x1="240" y1="434" x2="912" y2="434" stroke="#e6e6e6" stroke-width="1"/><text x="240" y="448" font-size="11" fill="#666666" font-weight="700">LATEST FLAGGED</text><rect x="240" y="474" width="672" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="3"/><rect x="240" y="508" width="672" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="3"/><rect x="240" y="542" width="672" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="3"/><rect x="240" y="576" width="672" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="3"/><line x1="240" y1="622" x2="912" y2="622" stroke="#e6e6e6" stroke-width="1"/><text x="240" y="636" font-size="11" fill="#666666" font-weight="700">THRESHOLDS</text><text x="240" y="670" font-size="13" fill="#262626" font-weight="600">Warn from</text><rect x="240" y="678" width="120" height="32" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1" rx="5"/><text x="420" y="670" font-size="13" fill="#262626" font-weight="600">Move to Junk from</text><rect x="420" y="678" width="120" height="32" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1" rx="5"/><text x="240" y="728" font-size="11" fill="#666666">Scores run from 0 to 1. The deployment default is 0.40 and 0.85.</text><rect x="240" y="742" width="123" height="26" fill="#f2f2f2" stroke="#cccccc" stroke-width="1" rx="5"/><text x="301.5" y="759.32" font-size="12" fill="#8a8a8a" font-weight="500" text-anchor="middle">Save thresholds</text><rect x="371" y="742" width="130" height="26" fill="#f2f2f2" stroke="#cccccc" stroke-width="1" rx="5"/><text x="436" y="759.32" font-size="12" fill="#8a8a8a" font-weight="500" text-anchor="middle">Reset to default</text><text x="240" y="790" font-size="11" fill="#666666">These values apply to mail arriving from now on.</text><text x="240" y="806" font-size="11" fill="#666666">Check again in a label list updates older mail.</text><line x1="240" y1="836" x2="912" y2="836" stroke="#e6e6e6" stroke-width="1"/><text x="240" y="850" font-size="11" fill="#666666" font-weight="700">PER LABEL</text><rect x="240" y="880" width="47" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="9"/><circle cx="249" cy="889" r="3" fill="#666666"/><text x="256" y="893" font-size="11" fill="#262626" font-weight="600">Spam</text><rect x="380" y="880" width="200" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="3"/><rect x="240" y="920" width="71" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="9"/><circle cx="249" cy="929" r="3" fill="#666666"/><text x="256" y="933" font-size="11" fill="#262626" font-weight="600">Phishing</text><rect x="380" y="920" width="200" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="3"/><text x="240" y="968" font-size="11" fill="#666666">Warn only keeps the message where it arrived, under the warning banner.</text><line x1="240" y1="994" x2="912" y2="994" stroke="#e6e6e6" stroke-width="1"/><text x="240" y="1008" font-size="11" fill="#666666" font-weight="700">SENDERS</text><rect x="240" y="1030" width="672" height="42" fill="none" stroke="#bdbdbd" stroke-width="1" rx="6"/><text x="252" y="1048" font-size="13" fill="#262626" font-weight="600">Never in Spam</text><text x="252" y="1064" font-size="11" fill="#666666">Their mail skips the spam check.</text><rect x="692" y="1046" width="70" height="12" fill="#e6e6e6" stroke="none" stroke-width="1" rx="3"/><text x="900" y="1056" font-size="12" fill="#262626" font-weight="600" text-anchor="end" text-decoration="underline">Manage</text><rect x="240" y="1078" width="672" height="42" fill="none" stroke="#bdbdbd" stroke-width="1" rx="6"/><text x="252" y="1096" font-size="13" fill="#262626" font-weight="600">Reported</text><text x="252" y="1112" font-size="11" fill="#666666">Their mail goes straight to Junk.</text><rect x="692" y="1094" width="70" height="12" fill="#e6e6e6" stroke="none" stroke-width="1" rx="3"/><text x="900" y="1104" font-size="12" fill="#262626" font-weight="600" text-anchor="end" text-decoration="underline">Manage</text><line x1="240" y1="1142" x2="912" y2="1142" stroke="#e6e6e6" stroke-width="1"/><circle cx="960" cy="100" r="9" fill="#262626"/><text x="960" y="104" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="974" y="104" font-size="11" fill="#666666" font-style="italic">Skeletons, never zeros. Inputs stay disabled</text><text x="974" y="119" font-size="11" fill="#666666" font-style="italic">until the saved values arrive.</text>
</g>
</svg>
