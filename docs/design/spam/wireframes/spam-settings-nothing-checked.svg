<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="870" viewBox="0 0 1280 870" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="870" fill="#ffffff" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1280" height="44" fill="#f2f2f2" stroke="none" stroke-width="1"/><line x1="0" y1="44" x2="1280" y2="44" stroke="#bdbdbd" stroke-width="1"/><text x="16" y="20" font-size="14" fill="#262626" font-weight="700">Spam settings: nothing checked yet</text><text x="16" y="36" font-size="11" fill="#666666" font-family="monospace">Story: Playground/Proposed/Spam settings NothingChecked</text>
<g transform="translate(0,44)">
<rect x="0" y="0" width="220" height="826" fill="#f2f2f2" stroke="none" stroke-width="1"/><line x1="220" y1="0" x2="220" y2="826" stroke="#bdbdbd" stroke-width="1"/><line x1="0" y1="48" x2="220" y2="48" stroke="#bdbdbd" stroke-width="1"/><text x="16" y="30" font-size="13" fill="#262626">&lt; Back to mail</text><text x="16" y="72" font-size="10" fill="#666666" font-weight="700">SETTINGS</text><rect x="18" y="90" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="100" font-size="13" fill="#262626" font-weight="400">Accounts</text><rect x="18" y="120" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="130" font-size="13" fill="#262626" font-weight="400">Senders &amp; Rules</text><rect x="18" y="150" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="160" font-size="13" fill="#262626" font-weight="400">Folder roles</text><rect x="18" y="180" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="190" font-size="13" fill="#262626" font-weight="400">Filters</text><rect x="18" y="210" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="220" font-size="13" fill="#262626" font-weight="400">Labels</text><rect x="18" y="240" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="250" font-size="13" fill="#262626" font-weight="400">Mail classification</text><rect x="8" y="262" width="204" height="28" fill="#cccccc" stroke="none" stroke-width="1" rx="5"/><rect x="18" y="270" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="280" font-size="13" fill="#262626" font-weight="600">Spam &amp; phishing</text><text x="206" y="280" font-size="10" fill="#666666" text-anchor="end" font-style="italic">new</text><rect x="18" y="300" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="310" font-size="13" fill="#262626" font-weight="400">Calendars</text><rect x="18" y="330" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="340" font-size="13" fill="#262626" font-weight="400">Appearance</text><rect x="18" y="360" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="370" font-size="13" fill="#262626" font-weight="400">Warnings</text><rect x="18" y="390" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="400" font-size="13" fill="#262626" font-weight="400">Advanced</text><line x1="220" y1="48" x2="1280" y2="48" stroke="#bdbdbd" stroke-width="1"/><text x="240" y="30" font-size="16" fill="#262626" font-weight="700">Spam &amp; phishing</text><text x="390.4" y="30" font-size="12" fill="#666666">What Remit flagged, and when it acts.</text><text x="240" y="80" font-size="11" fill="#666666" font-weight="700">LAST 30 DAYS</text><rect x="240" y="100" width="672" height="90" fill="none" stroke="#bdbdbd" stroke-width="1" rx="6" stroke-dasharray="4 3"/><text x="576" y="140" font-size="14" fill="#262626" font-weight="600" text-anchor="middle">Remit has not checked any mail yet</text><text x="576" y="162" font-size="12" fill="#666666" text-anchor="middle">Counts appear here once new mail arrives.</text><line x1="240" y1="204" x2="912" y2="204" stroke="#e6e6e6" stroke-width="1"/><text x="240" y="218" font-size="11" fill="#666666" font-weight="700">LATEST FLAGGED</text><text x="240" y="254" font-size="12" fill="#666666">Nothing flagged yet.</text><line x1="240" y1="272" x2="912" y2="272" stroke="#e6e6e6" stroke-width="1"/><text x="240" y="286" font-size="11" fill="#666666" font-weight="700">THRESHOLDS</text><text x="240" y="320" font-size="13" fill="#262626" font-weight="600">Warn from</text><rect x="240" y="328" width="120" height="32" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" rx="5"/><text x="250" y="349" font-size="13" fill="#262626">0.40</text><text x="420" y="320" font-size="13" fill="#262626" font-weight="600">Move to Junk from</text><rect x="420" y="328" width="120" height="32" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" rx="5"/><text x="430" y="349" font-size="13" fill="#262626">0.85</text><text x="240" y="378" font-size="11" fill="#666666">Scores run from 0 to 1. The deployment default is 0.40 and 0.85.</text><rect x="240" y="392" width="123" height="26" fill="#262626" stroke="#262626" stroke-width="1" rx="5"/><text x="301.5" y="409.32" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Save thresholds</text><rect x="371" y="392" width="130" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" rx="5"/><text x="436" y="409.32" font-size="12" fill="#262626" font-weight="500" text-anchor="middle">Reset to default</text><text x="240" y="440" font-size="11" fill="#666666">These values apply to mail arriving from now on.</text><text x="240" y="456" font-size="11" fill="#666666">Check again in a label list updates older mail.</text><line x1="240" y1="486" x2="912" y2="486" stroke="#e6e6e6" stroke-width="1"/><text x="240" y="500" font-size="11" fill="#666666" font-weight="700">PER LABEL</text><rect x="240" y="530" width="47" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="9"/><circle cx="249" cy="539" r="3" fill="#666666"/><text x="256" y="543" font-size="11" fill="#262626" font-weight="600">Spam</text><rect x="380" y="524" width="189" height="28" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1" rx="6"/><rect x="382" y="526" width="80" height="24" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" rx="5"/><text x="422" y="542" font-size="12" fill="#262626" font-weight="600" text-anchor="middle">Warn only</text><text x="516.5" y="542" font-size="12" fill="#666666" font-weight="400" text-anchor="middle">Move to Junk</text><rect x="240" y="570" width="71" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="9"/><circle cx="249" cy="579" r="3" fill="#666666"/><text x="256" y="583" font-size="11" fill="#262626" font-weight="600">Phishing</text><rect x="380" y="564" width="189" height="28" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="1" rx="6"/><text x="422" y="582" font-size="12" fill="#666666" font-weight="400" text-anchor="middle">Warn only</text><rect x="466" y="566" width="101" height="24" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" rx="5"/><text x="516.5" y="582" font-size="12" fill="#262626" font-weight="600" text-anchor="middle">Move to Junk</text><text x="240" y="618" font-size="11" fill="#666666">Warn only keeps the message where it arrived, under the warning banner.</text><line x1="240" y1="644" x2="912" y2="644" stroke="#e6e6e6" stroke-width="1"/><text x="240" y="658" font-size="11" fill="#666666" font-weight="700">SENDERS</text><rect x="240" y="680" width="672" height="42" fill="none" stroke="#bdbdbd" stroke-width="1" rx="6"/><text x="252" y="698" font-size="13" fill="#262626" font-weight="600">Never in Spam</text><text x="252" y="714" font-size="11" fill="#666666">Their mail skips the spam check.</text><text x="762" y="706" font-size="12" fill="#262626" text-anchor="end">4 senders</text><text x="900" y="706" font-size="12" fill="#262626" font-weight="600" text-anchor="end" text-decoration="underline">Manage</text><rect x="240" y="728" width="672" height="42" fill="none" stroke="#bdbdbd" stroke-width="1" rx="6"/><text x="252" y="746" font-size="13" fill="#262626" font-weight="600">Reported</text><text x="252" y="762" font-size="11" fill="#666666">Their mail goes straight to Junk.</text><text x="762" y="754" font-size="12" fill="#262626" text-anchor="end">12 senders</text><text x="900" y="754" font-size="12" fill="#262626" font-weight="600" text-anchor="end" text-decoration="underline">Manage</text><line x1="240" y1="792" x2="912" y2="792" stroke="#e6e6e6" stroke-width="1"/>
</g>
</svg>
