ke="#666666" stroke-width="1" rx="2"/><text x="40" y="342" font-size="13" fill="#262626" font-weight="600">Junk</text><text x="200" y="342" font-size="11" fill="#666666" text-anchor="end">41</text><rect x="18" y="362" width="12" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/><text x="40" y="372" font-size="13" fill="#262626" font-weight="400">Trash</text><line x1="600" y1="0" x2="600" y2="800" stroke="#bdbdbd" stroke-width="1"/><rect x="220" y="0" width="380" height="48" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="220" y1="48" x2="600" y2="48" stroke="#bdbdbd" stroke-width="1"/><text x="236" y="30" font-size="15" fill="#262626" font-weight="700">Junk</text><rect x="220" y="48" width="380" height="124" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1"/><rect x="220" y="48" width="3" height="124" fill="#262626" stroke="none" stroke-width="1"/><circle cx="244" cy="68" r="8" fill="#ffffff" stroke="#262626" stroke-width="1.5"/><text x="244" y="72" font-size="11" fill="#262626" font-weight="700" text-anchor="middle">v</text><text x="590" y="64" font-size="10" fill="#666666" text-anchor="end" font-style="italic">tone: info</text><text x="262" y="73" font-size="13" fill="#262626" font-weight="700">Moved to Inbox.</text><text x="262" y="92" font-size="12" fill="#262626">Should mail from Sender name</text><text x="262" y="110" font-size="12" fill="#262626">(sender@example.com) stay out of Spam from now</text><text x="262" y="128" font-size="12" fill="#262626">on?</text><rect x="262" y="136" width="217" height="26" fill="#262626" stroke="#262626" stroke-width="1" rx="5"/><rect x="259" y="133" width="223" height="32" fill="none" stroke="#262626" stroke-width="2" rx="7" stroke-dasharray="3 2"/><text x="370.5" y="153.32" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Never put this sender in Spam</text><rect x="487" y="136" width="82" height="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" rx="5"/><text x="528" y="153.32" font-size="12" fill="#262626" font-weight="500" text-anchor="middle">No thanks</text><circle cx="246" cy="192" r="11" fill="#e6e6e6" stroke="#bdbdbd"/><text x="266" y="192" font-size="13" fill="#262626" font-weight="500">Sender name</text><text x="588" y="192" font-size="11" fill="#666666" text-anchor="end">09:14</text><text x="266" y="210" font-size="13" fill="#666666">Subject line</text><rect x="541" y="216" width="47" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="9"/><circle cx="550" cy="225" r="3" fill="#666666"/><text x="557" y="229" font-size="11" fill="#262626" font-weight="600">Spam</text><text x="266" y="228" font-size="11" fill="#666666">Snippet of the first line of the body</text><line x1="220" y1="236" x2="600" y2="236" stroke="#e6e6e6" stroke-width="1"/><circle cx="246" cy="256" r="11" fill="#e6e6e6" stroke="#bdbdbd"/><text x="266" y="256" font-size="13" fill="#262626" font-weight="500">Sender name</text><text x="588" y="256" font-size="11" fill="#666666" text-anchor="end">09:14</text><text x="266" y="274" font-size="13" fill="#666666">Subject line</text><rect x="517" y="280" width="71" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="9"/><circle cx="526" cy="289" r="3" fill="#666666"/><text x="533" y="293" font-size="11" fill="#262626" font-weight="600">Phishing</text><text x="266" y="292" font-size="11" fill="#666666">Snippet of the first line of the body</text><line x1="220" y1="300" x2="600" y2="300" stroke="#e6e6e6" stroke-width="1"/><circle cx="246" cy="320" r="11" fill="#e6e6e6" stroke="#bdbdbd"/><text x="266" y="320" font-size="13" fill="#262626" font-weight="500">Sender name</text><text x="588" y="320" font-size="11" fill="#666666" text-anchor="end">09:14</text><text x="266" y="338" font-size="13" fill="#666666">Subject line</text><rect x="541" y="344" width="47" height="18" fill="#e6e6e6" stroke="none" stroke-width="1" rx="9"/><circle cx="550" cy="353" r="3" fill="#666666"/><text x="557" y="357" font-size="11" fill="#262626" font-weight="600">Spam</text><text x="266" y="356" font-size="11" fill="#666666">Snippet of the first line of the body</text><line x1="220" y1="364" x2="600" y2="364" stroke="#e6e6e6" stroke-width="1"/><rect x="600" y="0" width="680" height="800" fill="#ffffff" stroke="none" stroke-width="1"/><text x="940" y="340" font-size="13" fill="#666666" text-anchor="middle">Select a conversation</text><circle cx="620" cy="420" r="9" fill="#262626"/><text x="620" y="424" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="634" y="424" font-size="11" fill="#666666" font-style="italic">The slot SpamRescue owns, above the Junk list. It holds one banner: the offer, else the rescue banner.</text><circle cx="620" cy="456" r="9" fill="#262626"/><text x="620" y="460" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="634" y="460" font-size="11" fill="#666666" font-style="italic">Not spam clears the open message, so the reader lands beside the offer.</text><circle cx="620" cy="492" r="9" fill="#262626"/><text x="620" y="496" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="634" y="496" font-size="11" fill="#666666" font-style="italic">The address always shows. A blocked sender gets "Unblock and never put this sender in Spam".</text>
