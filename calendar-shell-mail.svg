<circle cx="22" cy="936" r="11" fill="#222" stroke="none" stroke-width="1"/><text x="22" y="940" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="40" y="941" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222">The app bar holds Mail and Calendar only, links to /mail and /calendar. The active one has the bar and fill.</text><circle cx="22" cy="957" r="11" fill="#222" stroke="none" stroke-width="1"/><text x="22" y="961" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="40" y="962" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222">Hamburger toggles the side pane: folders here, mini month and calendars on Calendar.</text><circle cx="22" cy="978" r="11" fill="#222" stroke="none" stroke-width="1"/><text x="22" y="982" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="40" y="983" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222">The folder list loses its Calendar row. Settings stays in the folder list.</text>
