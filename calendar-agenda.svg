<text x="12" y="920" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-weight="bold">Agenda strip</text>
<circle cx="22" cy="936" r="11" fill="#222" stroke="none" stroke-width="1"/><text x="22" y="940" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="40" y="941" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222">Days list their events and the free stretches between them. A day heading opens the day view. Scrolling rewrites the date in /calendar/agenda/&lt;date&gt; by replace.</text><circle cx="22" cy="957" r="11" fill="#222" stroke="none" stroke-width="1"/><text x="22" y="961" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="40" y="962" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222">An event opens its popup. A free stretch opens quick-create on that stretch.</text><circle cx="22" cy="978" r="11" fill="#222" stroke="none" stroke-width="1"/><text x="22" y="982" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="40" y="983" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222">The density switch hides here: it applies to Day and Week only. The strip loads a week at a time, up to a year out, then shows Load more.</text>
</svg>