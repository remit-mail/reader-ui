name: Publish

on:
  push:
    tags: ["ui-v*"]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash npm-scripts/release-check-commit.sh "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund --loglevel=error
      # npm exchanges the GitHub OIDC token with a trusted publisher first and
      # falls back to NPM_TOKEN when the exchange is refused. npm accepts
      # provenance from a public source repository only.
      - run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
