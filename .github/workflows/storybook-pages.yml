name: Storybook Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Build Storybook
        run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-main
          path: packages/workbench/storybook-static
          retention-days: 1

  # Its own job so this is the only place that pushes to gh-pages carry the
  # shared cross-workflow concurrency group below -- the build above stays
  # cheap to re-run and never blocks on another push in flight.
  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-branch-push
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: storybook-main
          path: storybook-main-download
      # The Storybook owns the branch root; `pr/` holds the pull request
      # previews, which this publish leaves in place.
      - name: Publish Storybook to the gh-pages branch
        run: >-
          node npm-scripts/gh-pages-publish.mjs publish
          --source storybook-main-download
          --dest .
          --preserve pr
          --message "Publish Storybook from ${{ github.sha }}"
